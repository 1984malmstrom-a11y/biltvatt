name: Validate station V2 launch script

on:
  push:
    branches: [feat/station-dashboard-v2]
    paths:
      - scripts/**
      - tests/**
      - e2e/**
      - worker/**
      - migrations/**
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/station-v2-launch-check.yml

jobs:
  parse-windows-powershell:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all unit tests on Windows
        run: npm test
      - name: Check TypeScript on Windows
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run all Playwright tests twice in isolated Windows environments
        shell: powershell
        run: |
          for ($i = 1; $i -le 2; $i++) {
            $result = node .\scripts\run-isolated-e2e.mjs | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $result.ok -or $result.passed -lt 25) {
              $failures = @($result.failures | ForEach-Object { "$($_.file):$($_.line) $($_.assertion) $($_.source)" })
              $diagnostic = if ($result.diagnostic) { "HTTP /=$($result.diagnostic.rootStatus), /api/staff=$($result.diagnostic.staffStatus), /src/main.tsx=$($result.diagnostic.moduleStatus), demoantal=$($result.diagnostic.staffCount), rubrik senare=$($result.diagnostic.headingVisibleLater), JS-fel=$($result.diagnostic.pageErrorCount)" } else { 'ingen säker startdiagnostik' }
              throw "Isolated Playwright pass $i failed at $($result.stage): $($failures -join '; '); $diagnostic"
            }
            Write-Host "Isolated Playwright pass $i passed: $($result.passed) tests."
          }
      - name: Build production bundle on Windows
        run: npm run build
      - name: Parse script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts\launch-station-v2.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell 5.1 syntax OK.'
      - name: Exercise private snapshot checks with synthetic data
        shell: powershell
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'station-v2-synthetic.sql'
          $migrations = Get-ChildItem 'migrations\*.sql' | Sort-Object Name
          $sql = ($migrations | ForEach-Object { [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8) }) -join "`n"
          [IO.File]::WriteAllText($snapshot, $sql, [Text.UTF8Encoding]::new($false))
          $result = node .\scripts\station-v2-snapshot.mjs query $snapshot 'PRAGMA integrity_check' | ConvertFrom-Json
          if (-not $result.ok -or $result.results[0].integrity_check -ne 'ok') { throw 'Snapshot integrity smoke test failed.' }
          $blocked = node .\scripts\station-v2-snapshot.mjs query $snapshot 'DELETE FROM sales' | ConvertFrom-Json
          if ($blocked.ok -or $blocked.errorType -ne 'invalid_read_only_query') { throw 'Read-only guard failed.' }
          $legacyPath = Join-Path $env:RUNNER_TEMP 'station-v2-legacy-synthetic.sql'
          $legacySql = ($migrations[0..3] | ForEach-Object { [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8) }) -join "`n"
          [IO.File]::WriteAllText($legacyPath, $legacySql, [Text.UTF8Encoding]::new($false))
          $legacy = node .\scripts\station-v2-backup-keys.mjs $legacyPath | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($legacy.station_schedule_periods).Count -ne 0 -or @($legacy.station_shifts).Count -ne 0) {
            throw 'Pre-0005 backup keys were not interpreted as empty V2 rows.'
          }
          if (@($legacy.staff).Count -ne 5 -or @($legacy.wash_programs).Count -ne 6) {
            throw 'Legacy V1 rows were not preserved by the backup check.'
          }
