name: Validate station V2 launch script

on:
  push:
    branches: [feat/station-dashboard-v2]
    paths:
      - scripts/launch-station-v2.ps1
      - scripts/station-v2-snapshot.mjs
      - scripts/push-keys.mjs
      - scripts/local-secret.mjs
      - tests/**
      - e2e/**
      - worker/**
      - migrations/**
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/station-v2-launch-check.yml

jobs:
  parse-windows-powershell:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all unit tests on Windows
        run: npm test
      - name: Prepare local-only Playwright D1 and PIN
        run: npm run setup
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run all Playwright tests on Windows
        run: npm run test:e2e
      - name: Parse script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts\launch-station-v2.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell 5.1 syntax OK.'
      - name: Exercise private snapshot checks with synthetic data
        shell: powershell
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'station-v2-synthetic.sql'
          $migrations = Get-ChildItem 'migrations\*.sql' | Sort-Object Name
          $sql = ($migrations | ForEach-Object { [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8) }) -join "`n"
          [IO.File]::WriteAllText($snapshot, $sql, [Text.UTF8Encoding]::new($false))
          $result = node .\scripts\station-v2-snapshot.mjs query $snapshot 'PRAGMA integrity_check' | ConvertFrom-Json
          if (-not $result.ok -or $result.results[0].integrity_check -ne 'ok') { throw 'Snapshot integrity smoke test failed.' }
          $blocked = node .\scripts\station-v2-snapshot.mjs query $snapshot 'DELETE FROM sales' | ConvertFrom-Json
          if ($blocked.ok -or $blocked.errorType -ne 'invalid_read_only_query') { throw 'Read-only guard failed.' }
